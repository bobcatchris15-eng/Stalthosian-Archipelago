    label: Independent juvenile
    age_label: independent juvenile (not a literal hatchling)
    age_years: [0.5, 3]
    total_length: { value: 1.8, unit: m }
    height_at_shoulder: { value: 0.95, unit: m }
    proportions:
      skull: 0.052
      cervical: 0.26
      dorsal: 0.24
      caudal: 0.24
      humerus: 0.062
      femur: 0.09
      pes: 0.052
    girth_scale: 0.62
    head_scale: 1.3
    skin:
      thickness_mm: 6
      wrinkle_regions: [ankle, groin]
      callus_regions: [hip]
    visible_traits:
      - proportionally large expressive head and eyes
      - dense short bristles on nape and upper back
      - fine pebbled skin, modest early armor nodules
      - slight juvenile banding
  - id: subadult
    label: Subadult
    age_label: subadult
    age_years: [3, 9]
    total_length: { value: 3.6, unit: m }
    height_at_shoulder: { value: 1.7, unit: m }
    proportions:
      skull: 0.04
      cervical: 0.28
      dorsal: 0.23
      caudal: 0.27
      humerus: 0.057
      femur: 0.081
      pes: 0.047
    girth_scale: 0.85
    head_scale: 1.1
    skin:
      thickness_mm: 12
      wrinkle_regions: [neck_lateral, shoulder, hip, ankle]
      callus_regions: [hip, shoulder]
    visible_traits:
      - thicker torso, stronger limbs
      - conspicuous embedded osteoderms
      - bristles thinning, retained in clumps
  - id: adult
    label: Adult
    age_label: adult
    age_years: [9, 60]
    total_length: { value: 5.6, unit: m }
    height_at_shoulder: { value: 2.4, unit: m }
    proportions:
      skull: 0.032
      cervical: 0.3
      dorsal: 0.22
      caudal: 0.28
      humerus: 0.055
      femur: 0.075
      pes: 0.045
    girth_scale: 1.0
    head_scale: 1.0
    skin:
      thickness_mm: 22
      wrinkle_regions: [neck_lateral, throat, shoulder, hip, groin, tail_base, ankle]
      callus_regions: [hip, shoulder, tail_base]
    visible_traits:
      - deeply wrinkled, thick skin over shoulders and hips
      - sparse residual bristles
      - larger, denser embedded osteoderm nodules
      - nonuniform pigmentation with wear and healing scars

rig:
  skeleton:
    bone_count_range: [96, 140]
    hierarchical: true
    root: root
    bone_naming: region_index
  ik:
    - id: leg_fore_l
      type: leg
      chain: [humerus, radius, manus]
      reach_limit_m: 1.1
    - id: leg_fore_r
      type: leg
      chain: [humerus, radius, manus]
      reach_limit_m: 1.1
    - id: leg_hind_l
      type: leg
      chain: [femur, tibia, pes]
      pole_target: pelvis
      reach_limit_m: 1.3
    - id: leg_hind_r
      type: leg
      chain: [femur, tibia, pes]
      pole_target: pelvis
      reach_limit_m: 1.3
    - id: neck_chain
      type: neck
      chain: [cervical, dorsal]
      reach_limit_m: 3.4
    - id: tail_chain
      type: tail
      chain: [caudal]
    - id: jaw_open
      type: jaw
      chain: [mandible]
    - id: head_look
      type: head_look
      chain: [skull]
  skin:
    method: heat_weighted
    max_influences_per_vertex: 4
    preserve_volume: true
    pin_regions: [neck_base, tail_base]
  morph_targets:
    - id: juvenile_fluff
      region: nape
      driver: life_stage
      range: [0, 1]
    - id: mature_skin_wrinkle
      region: neck_lateral
      driver: life_stage
      range: [0, 1]
    - id: browse_depletion
      region: jaw_contact
      driver: browse_depletion
      range: [0, 1]

animation_contacts:
  - id: browse_low_shrub
    kind: browse
    targets:
      - selector: "brush:zone/tender"
        tolerance_m: 0.12
        surface: plant
      - selector: "bone:jaw_tip"
        tolerance_m: 0.1
        surface: self
    notes: Head and neck must actually meet the targeted foliage for a browse to read.
  - id: browse_high_shoot
    kind: browse
    targets:
      - selector: "plant.splitcrown.ar1|selector:sapling_tips"
        tolerance_m: 0.15
        surface: plant
  - id: drink
    kind: drink
    targets:
      - selector: "water:surface"
        tolerance_m: 0.08
        surface: water
  - id: walk_cycle
    kind: gait
    targets:
      - selector: "bone:pes_foot_l"
        tolerance_m: 0.02
        surface: ground
      - selector: "bone:pes_foot_r"
        tolerance_m: 0.02
        surface: ground
  - id: rest_stand
    kind: rest
    targets:
      - selector: "bone:manus_front_l"
        tolerance_m: 0.05
        surface: ground
  - id: startle_alert
    kind: alert
    targets:
      - selector: "bone:head_tip"
        tolerance_m: 0.0
        surface: none

integument:
  scale_zones:
    - id: dorsal_pebble
      region: dorsal
      pattern: pebbled
      size_mm: [4, 9]
      density_per_m2: 900
      roughness: [0.55, 0.8]
      age_dependence: grows_with_age
    - id: flank_rosette
      region: flank
      pattern: rosette
      size_mm: [10, 26]
      density_per_m2: 180
      roughness: [0.5, 0.75]
      age_dependence: grows_with_age
    - id: limb_crease
      region: limb
      pattern: creased
      size_mm: [6, 14]
      density_per_m2: 500
      roughness: [0.6, 0.85]
    - id: neck_small_pebble
      region: neck
      pattern: pebbled
      size_mm: [3, 7]
      density_per_m2: 1200
      roughness: [0.5, 0.75]
    - id: ventral_soft
      region: ventral
      pattern: smooth
      size_mm: [2, 5]
      density_per_m2: 1600
      roughness: [0.45, 0.7]
    - id: tail_band
      region: tail
      pattern: mottled_banded
      size_mm: [5, 11]
      density_per_m2: 700
      roughness: [0.55, 0.8]
  osteoderm_zones:
    - id: upper_back_plates
      region: upper_back
      shape: oval
      count_range: [40, 90]
      size_mm: [6, 26]
      spacing_m: 0.07
      coverage_share: 0.12
      age_dependence: emerges_with_age
      uncertainty: speculative
    - id: shoulder_nodules
      region: shoulder
      shape: nodular
      count_range: [10, 26]
      size_mm: [8, 30]
      spacing_m: 0.05
      coverage_share: 0.1
      age_dependence: grows_with_age
      uncertainty: speculative
    - id: hip_nodules
      region: hip
      shape: round
      count_range: [12, 30]
      size_mm: [8, 34]
      spacing_m: 0.05
      coverage_share: 0.09
      age_dependence: grows_with_age
      uncertainty: speculative
    - id: tail_base_plates
      region: tail_base
      shape: keeled
      count_range: [6, 18]
      size_mm: [5, 16]
      spacing_m: 0.08
      coverage_share: 0.07
      age_dependence: juvenile_only
      uncertainty: speculative
  bristle_zones:
    - id: nape_bristles
      region: nape
      length_mm: [25, 70]
      density_per_m2: 2200
      stiffness: 0.75
      asymmetry: 0.6
      wind_response: flexible
      age_dependence: sheds_with_age
      uncertainty: speculative
      hypothesized_function: concealment
    - id: shoulder_bristles
      region: shoulder
      length_mm: [30, 80]
      density_per_m2: 1400
      stiffness: 0.7
      asymmetry: 0.5
      wind_response: flexible
      age_dependence: retained_reduced
      uncertainty: speculative
      hypothesized_function: communication
    - id: dorsum_bristles
      region: dorsum
      length_mm: [15, 45]
      density_per_m2: 700
      stiffness: 0.6
      asymmetry: 0.4
      wind_response: whip
      age_dependence: juvenile_only
      uncertainty: speculative
      hypothesized_function: thermoregulation
  fold_zones:
    - id: fold_neck_lateral
      region: neck_lateral
      depth_mm: 12
      pose_driven: true
    - id: fold_throat
      region: throat
      depth_mm: 8
      pose_driven: true
    - id: fold_shoulder
      region: shoulder
      depth_mm: 16
      pose_driven: true
    - id: fold_hip
      region: hip
      depth_mm: 18
      pose_driven: true
    - id: fold_ankle
      region: ankle
      depth_mm: 6
      pose_driven: true
  pigmentation:
    pattern: mottled
    age_change: subtle juvenile banding softens and spreads with age
    wear: moderate

