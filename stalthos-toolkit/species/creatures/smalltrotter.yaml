# Smalltrotter -- flagship dwarf titanosaur anatomical proxy.
#
# Source of record: Rauken-Archipelago/docs/creatures.md, "Smalltrotter" section.
# Every number here is a *working design value* for an invented taxon:
#   - total length / mass envelopes come from that document and are explicitly
#     not verified measurements;
#   - osteoderm distribution, and especially the keratinous bristles, have no
#     fossil support and are marked `uncertainty: speculative`;
#   - no citation is asserted anywhere in this file, because none has been
#     verified yet. Collecting real references is exactly what stage 1
#     (research_species) is for.
schema: creature-definition
kind: creature
id: creature.smalltrotter.st1
version: 1

common_names:
  primary: Smalltrotter
  working: true
  aka: [st, the small trotter]

uncertainty: speculative
morphology_family: titanosauriform sauropod (anatomical inspiration, not a claim)
generator: quadruped_sauropod

evidence:
  - feature: quadrupedal weight-bearing skeleton, long neck, four limbs
    tier: documented
    note: Broad sauropod body plan; regional detail still to be researched.
  - feature: non-uniform ontogenetic proportions (head/neck/limbs/trunk/tail)
    tier: biomechanical_plausibility
  - feature: pebbled skin with regional rosettes, folds at compressive areas
    tier: comparative_inference
    note: Skin inference in the sauropod literature is debated; region map is invented.
  - feature: spaced subdermal osteoderm nodules on upper back/shoulders/hips
    tier: speculative
    note: Count, placement and growth are fictional, not a titanosaur claim.
  - feature: keratinous bristles on nape/shoulders/dorsum
    tier: speculative
    note: >-
      Deliberate fiction. No sauropod bristle/quill has confirmed fossil
      evidence; these are invented filaments, not a feathered-titanosaur claim.
  - feature: life-stage skin covering transformation
    tier: speculative
    note: Chosen creative feature; ontogenetic covering changes have living analogues.

body_plan:
