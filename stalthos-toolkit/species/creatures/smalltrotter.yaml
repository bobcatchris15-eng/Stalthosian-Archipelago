  spine_profile: sloped
  neck_length_share: 0.36
  tail_length_share: 0.34
  center_of_mass_m: { value: 0.95, unit: m }
  mass_estimate:
    value: 950
    unit: kg
    measured: false
    range: [700, 1200]
    note: Working hypothesis from docs/creatures.md; recompute from volumetric anatomy.
  axial:
    cervical_count: 15
    dorsal_count: 13
    caudal_count: 32
    ribcage_depth_share: 0.34
    skull_profile: small_relative
  skeleton:
    - id: skull
      region: skull
      length_share: 0.032
      mass_share: 0.012
      joint_limit_deg: { flex: 22, extend: 32, twist: 18 }
      driven_by: skeleton
    - id: mandible
      region: mandible
      length_share: 0.028
      mass_share: 0.009
      joint_limit_deg: { flex: 26, extend: 34, twist: 6 }
      driven_by: hybrid
    - id: cervical
      region: cervical
      length_share: 0.3
      mass_share: 0.14
      joint_limit_deg: { flex: 45, extend: 40, twist: 30 }
      driven_by: hybrid
    - id: dorsal
      region: dorsal
      length_share: 0.22
      mass_share: 0.31
      joint_limit_deg: { flex: 18, extend: 16, twist: 8 }
      driven_by: skeleton
    - id: sacral
      region: sacral
      length_share: 0.05
      mass_share: 0.09
      joint_limit_deg: { flex: 12, extend: 12, twist: 8 }
      driven_by: skeleton
    - id: caudal
      region: caudal
      length_share: 0.28
      mass_share: 0.1
      joint_limit_deg: { flex: 34, extend: 30, twist: 18 }
      driven_by: soft_tissue
    - id: pectoral_girdle
      region: pectoral_girdle
      length_share: 0.03
      mass_share: 0.06
      joint_limit_deg: { flex: 20, extend: 24, twist: 12 }
      driven_by: skeleton
    - id: humerus
      region: forelimb_humerus
      length_share: 0.055
      mass_share: 0.05
      joint_limit_deg: { flex: 48, extend: 62, twist: 40 }
      driven_by: skeleton
    - id: radius
      region: forelimb_radius
      length_share: 0.05
      mass_share: 0.028
      joint_limit_deg: { flex: 60, extend: 55, twist: 30 }
      driven_by: skeleton
    - id: manus
      region: forelimb_manus
      length_share: 0.035
      mass_share: 0.012
      joint_limit_deg: { flex: 40, extend: 45, twist: 20 }
      driven_by: soft_tissue
    - id: femur
      region: hindlimb_femur
      length_share: 0.075
      mass_share: 0.072
      joint_limit_deg: { flex: 46, extend: 70, twist: 25 }
      driven_by: skeleton
    - id: tibia
      region: hindlimb_tibia
      length_share: 0.07
      mass_share: 0.04
      joint_limit_deg: { flex: 40, extend: 62, twist: 20 }
      driven_by: skeleton
    - id: pes
      region: hindlimb_pes
      length_share: 0.045
      mass_share: 0.02
      joint_limit_deg: { flex: 28, extend: 34, twist: 10 }
      driven_by: soft_tissue
  locomotion:
    gaits: [walk, amble]
    duty_factor: 0.62
    footfall: lateral sequence walk
    reach: { value: 3.4, unit: m }
  hydration:
    drink_reach_m: 0.35
    requires_kneel: false

life_stages:
