      preference: 0.85
      plant_selectors: ["plant.softbough.sh1|tip:soft"]
    - resource: shoot
      preference: 0.8
      plant_selectors: ["plant.softbough.sh1", "plant.splitcrown.ar1|selector:sapling_tips"]
    - resource: frond
      preference: 0.4
      plant_selectors: ["plant.royalfrond.fn1|frond:young"]
    - resource: jointed_stem
      preference: 0.35
      plant_selectors: ["plant.jointreed.eq1|culm:tender"]
    - resource: fruit
      preference: 0.5
    - resource: water
      preference: 0.7
  interaction_envelope:
    reach_height_m: { value: 3.4, unit: m }
    reach_radius_m: 2.2
    mouth_tip_selector: "bone:jaw_tip"
    clearance_width_m: 1.1
  terrain_preference: [riparian, clearing_edge, main_island_woodland_edge, browsed_patch]
  abundance: common
  activity_rhythm: diurnal
  signature_routines:
    - browse reachable shrubs with visible shoot depletion
    - drink from pool margins and creek terraces
    - slow lateral-sequence walking, pause and look up
    - settle and rest standing or lying with legs folded under

habitat_tags: [main_island_woodland, riparian, clearing_edge, browsed_patch]

