# Brackenback -- small true ankylosaurid (lineage stub).
#
# Source of record: Rauken-Archipelago/docs/creatures.md, "Brackenback" section.
# Purpose: prove the creature contract handles an armour-dominated low
# quadruped with an age-dependent tail club -- no bristles, continuous-ish
# osteoderm coverage, wide stance. All numbers are invented working values for a
# fictional taxon; no citation is asserted.
schema: creature-definition
kind: creature
id: creature.brackenback.bk1
version: 1

common_names:
  primary: Brackenback
  working: true
  aka: [bracken back, bark-shield]

uncertainty: speculative
morphology_family: ankylosaurid (small, stout, clubbed) -- inspiration, not a settled taxon
generator: low_slung_quadruped

evidence:
  - feature: low, broad skull and stout limbs
    tier: documented
  - feature: well-developed osteoderms with a stiffened tail
    tier: documented
    note: Broad ankylosaurid character; specific counts/placements below are invented.
  - feature: age-dependent club growth and juvenile light armour
    tier: comparative_inference
  - feature: club proportions and strike mechanics
    tier: speculative
    note: docs/creatures.md leaves adult size, mass and club mechanics open.
  - feature: overgeneralised protection of any distressed small animal
    tier: speculative
    note: Behavioural design from the design-analogy note, not ankylosaur evidence.

body_plan:
  posture: quadrupedal
  spine_profile: horizontal
  neck_length_share: 0.1
  tail_length_share: 0.36
  center_of_mass_m: { value: 0.4, unit: m }
  mass_estimate:
    value: 260
    unit: kg
    measured: false
    range: [180, 420]
    note: Working hypothesis; exact adult size and mass await anatomy work.
  axial:
    cervical_count: 8
    dorsal_count: 15
    caudal_count: 24
    ribcage_depth_share: 0.42
    skull_profile: broad_flanged
  skeleton:
    - id: skull
      region: skull
      length_share: 0.11
      mass_share: 0.08
      joint_limit_deg: { flex: 12, extend: 12, twist: 8 }
      driven_by: skeleton
    - id: cervical
      region: cervical
      length_share: 0.08
      mass_share: 0.05
      joint_limit_deg: { flex: 18, extend: 14, twist: 10 }
      driven_by: skeleton
    - id: dorsal
      region: dorsal
      length_share: 0.32
      mass_share: 0.28
      joint_limit_deg: { flex: 10, extend: 10, twist: 6 }
      driven_by: skeleton
    - id: sacral
      region: sacral
      length_share: 0.05
      mass_share: 0.09
      joint_limit_deg: { flex: 8, extend: 8, twist: 5 }
      driven_by: skeleton
    - id: caudal
      region: caudal
      length_share: 0.32
      mass_share: 0.14
      joint_limit_deg: { flex: 8, extend: 8, twist: 6 }
      driven_by: soft_tissue
    - id: humerus
      region: forelimb_humerus
      length_share: 0.08
      mass_share: 0.05
      joint_limit_deg: { flex: 30, extend: 35, twist: 15 }
      driven_by: skeleton
    - id: femur
      region: hindlimb_femur
      length_share: 0.1
      mass_share: 0.06
      joint_limit_deg: { flex: 28, extend: 40, twist: 12 }
      driven_by: skeleton
    - id: tibia
      region: hindlimb_tibia
      length_share: 0.08
      mass_share: 0.04
      joint_limit_deg: { flex: 22, extend: 30, twist: 10 }
      driven_by: skeleton
    - id: pes
      region: hindlimb_pes
      length_share: 0.07
      mass_share: 0.02
      joint_limit_deg: { flex: 18, extend: 20, twist: 8 }
      driven_by: soft_tissue
  locomotion:
    gaits: [walk, amble]
    duty_factor: 0.7
    footfall: wide lateral sequence walk
    reach: { value: 0.9, unit: m }
  hydration:
    drink_reach_m: 0.2
    requires_kneel: false

life_stages:
  - id: hatchling
    label: Hatchling
    age_years: [0, 0.3]
    total_length: { value: 0.55, unit: m }
    height_at_shoulder: { value: 0.16, unit: m }
    proportions: { skull: 0.14, dorsal: 0.34, caudal: 0.24, femur: 0.1 }
    girth_scale: 0.9
    head_scale: 1.25
    skin: { thickness_mm: 3, wrinkle_regions: [ankle], callus_regions: [] }
    visible_traits: [soft_shell, few_small_osteoderms, no_club]
  - id: juvenile
    label: Juvenile
    age_years: [0.3, 3]
    total_length: { value: 1.3, unit: m }
    height_at_shoulder: { value: 0.36, unit: m }
    proportions: { skull: 0.12, dorsal: 0.33, caudal: 0.3, femur: 0.1 }
    girth_scale: 1.0
    head_scale: 1.1
    skin: { thickness_mm: 6, wrinkle_regions: [neck_lateral, ankle], callus_regions: [hip] }
    visible_traits: [developing_keeled_plates, club_bud]
  - id: adult
    label: Adult
    age_years: [3, 25]
    total_length: { value: 2.6, unit: m }
    height_at_shoulder: { value: 0.62, unit: m }
    proportions: { skull: 0.11, dorsal: 0.32, caudal: 0.32, femur: 0.1 }
    girth_scale: 1.0
    head_scale: 1.0
    skin: { thickness_mm: 12, wrinkle_regions: [neck_lateral, hip, ankle], callus_regions: [hip, shoulder] }
    visible_traits:
      - developed osteoderm body
      - stiffened tail with age-proportioned club
      - broad flank presentation posture

rig:
  skeleton:
    bone_count_range: [70, 110]
    hierarchical: true
    root: pelvis
    bone_naming: region_index
  ik:
    - id: leg_fore_l
      type: leg
      chain: [humerus]
      reach_limit_m: 0.4
    - id: leg_fore_r
      type: leg
      chain: [humerus]
      reach_limit_m: 0.4
    - id: leg_hind_l
      type: leg
      chain: [femur, tibia, pes]
      pole_target: pelvis
      reach_limit_m: 0.5
    - id: leg_hind_r
      type: leg
      chain: [femur, tibia, pes]
      pole_target: pelvis
      reach_limit_m: 0.5
    - id: tail_chain
      type: tail
      chain: [caudal]
    - id: head_look
      type: head_look
      chain: [skull]
  skin:
    method: voxel_geodesic
    max_influences_per_vertex: 4
    preserve_volume: true
    pin_regions: [tail_base, shoulder]
  morph_targets:
    - id: flank_present
      region: flank
      driver: pose
      range: [0, 1]
    - id: club_swell
      region: tail_base
      driver: life_stage
      range: [0, 1]
    - id: damage_groove
      region: upper_back
      driver: damage
      range: [0, 1]

animation_contacts:
  - id: walk_cycle
    kind: gait
    targets:
      - selector: "bone:pes_foot_l"
        tolerance_m: 0.02
        surface: ground
      - selector: "bone:pes_foot_r"
        tolerance_m: 0.02
        surface: ground
  - id: browse_low
    kind: browse
    targets:
      - selector: "brush:zone/tough"
        tolerance_m: 0.1
        surface: plant
      - selector: "bone:beak_tip"
        tolerance_m: 0.06
        surface: self
  - id: tail_strike
    kind: defensive
    targets:
      - selector: "bone:club_tip"
        tolerance_m: 0.05
        surface: none
  - id: suspicious_pause
    kind: alert
    targets:
      - selector: "bone:head_tip"
        tolerance_m: 0.0
        surface: none

integument:
  scale_zones:
    - id: armour_keel
      region: dorsal
      pattern: pustulose
      size_mm: [25, 70]
      density_per_m2: 220
      roughness: [0.45, 0.75]
      age_dependence: grows_with_age
    - id: flank_band
      region: flank
      pattern: granular
      size_mm: [8, 22]
      density_per_m2: 600
      roughness: [0.55, 0.8]
    - id: belly_bare
      region: ventral
      pattern: granular
      size_mm: [4, 10]
      density_per_m2: 1200
      roughness: [0.6, 0.85]
    - id: tail_rings
      region: tail
      pattern: creased
      size_mm: [10, 30]
      density_per_m2: 400
      roughness: [0.5, 0.8]
  osteoderm_zones:
    - id: keeled_dorsal_band
      region: upper_back
      shape: keeled
      count_range: [60, 140]
      size_mm: [40, 90]
      spacing_m: 0.05
      coverage_share: 0.55
      age_dependence: grows_with_age
      uncertainty: speculative
    - id: flank_scutes
      region: flank
      shape: oval
      count_range: [40, 110]
      size_mm: [25, 70]
      spacing_m: 0.07
      coverage_share: 0.4
      age_dependence: grows_with_age
      uncertainty: speculative
    - id: cervical_scutes
      region: cervical
      shape: subrectangular
      count_range: [12, 30]
      size_mm: [15, 40]
      spacing_m: 0.05
      coverage_share: 0.3
      age_dependence: juvenile_only
      uncertainty: speculative
    - id: tail_ball
      region: tail_base
      shape: round
      count_range: [20, 60]
      size_mm: [30, 80]
      spacing_m: 0.03
      coverage_share: 0.8
      age_dependence: emerges_with_age
      uncertainty: speculative
  fold_zones:
    - id: fold_neck_lateral
      region: neck_lateral
      depth_mm: 10
      pose_driven: true
    - id: fold_shoulder
      region: shoulder
      depth_mm: 12
      pose_driven: true
    - id: fold_ankle
      region: ankle
      depth_mm: 5
      pose_driven: true
  pigmentation:
    pattern: countershading
    age_change: juvenile banding lost as plates thicken and darken
    wear: heavy

material_masks:
  - id: hide_base
    applies_to: body
    surface_type: hide
    vertex_group: body_skin
    base_color: "#5f4b33"
    color_range: ["#463628", "#5f4b33", "#75604a"]
    roughness: [0.6, 0.9]
    normal_strength: 1.1
    mask_uv: mask_hide_base
  - id: armour_horn
    applies_to: osteoderm
    surface_type: horn
    vertex_group: armor_zone
    base_color: "#7a6a52"
    color_range: ["#5d5140", "#7a6a52", "#8f7f65"]
    roughness: [0.3, 0.65]
    normal_strength: 1.5
    mask_uv: mask_armor
  - id: beak_horn
    applies_to: beak
    surface_type: beak
    base_color: "#6a5c46"
    roughness: [0.35, 0.6]
  - id: foot_pad
    applies_to: foot_pad
    surface_type: foot_pad
    roughness: [0.7, 0.95]
