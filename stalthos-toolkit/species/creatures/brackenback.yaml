  - id: eye
    applies_to: eye
    surface_type: eye
    base_color: "#2a2018"
    roughness: [0.05, 0.2]

affordances:
  diet_tags:
    - resource: tough_foliage
      preference: 0.7
      plant_selectors: ["plant.jointreed.eq1|culm:all"]
    - resource: frond
      preference: 0.45
      plant_selectors: ["plant.basketfern.fn2|pinna:inner"]
    - resource: tender_foliage
      preference: 0.15
      plant_selectors: ["plant.softbough.sh1"]
    - resource: insect
      preference: 0.35
  interaction_envelope:
    reach_height_m: { value: 0.75, unit: m }
    reach_radius_m: 0.7
    mouth_tip_selector: "bone:beak_tip"
    clearance_width_m: 1.4
  terrain_preference: [sandy_lowland, talus_slope, clearing_edge, woodland_edge]
  abundance: common
  activity_rhythm: diurnal
  signature_routines:
    - steady deliberate walking through brush
    - wary pause, stare and flank presentation at unexpected movement
    - low-tough-forage cropping with the small broad beak
    - tail-flick and bluff-advance defence when genuinely warranted

habitat_tags: [sandy_lowland, talus_slope, clearing_edge, woodland_edge, stone_island_scrub]

