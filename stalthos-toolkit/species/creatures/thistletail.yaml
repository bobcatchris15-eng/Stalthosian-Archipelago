      length_share: 0.11
      mass_share: 0.09
      joint_limit_deg: { flex: 60, extend: 95, twist: 30 }
      driven_by: skeleton
    - id: tibia
      region: hindlimb_tibia
      length_share: 0.11
      mass_share: 0.05
      joint_limit_deg: { flex: 70, extend: 80, twist: 25 }
      driven_by: skeleton
    - id: pes
      region: hindlimb_pes
      length_share: 0.09
      mass_share: 0.02
