rig:
  skeleton:
    bone_count_range: [48, 72]
    hierarchical: true
    root: pelvis
    bone_naming: region_index
  ik:
    - id: leg_hind_l
      type: leg
      chain: [femur, tibia, pes]
      pole_target: pelvis
      reach_limit_m: 0.4
    - id: leg_hind_r
      type: leg
      chain: [femur, tibia, pes]
      pole_target: pelvis
      reach_limit_m: 0.4
    - id: neck_chain
      type: neck
      chain: [cervical, dorsal]
      reach_limit_m: 0.4
    - id: tail_chain
      type: tail
      chain: [caudal]
    - id: head_look
      type: head_look
      chain: [skull]
    - id: beak_snap
      type: jaw
      chain: [mandible]
  skin:
    method: automatic_bones
    max_influences_per_vertex: 3
    preserve_volume: false
    pin_regions: [tail_base]
  morph_targets:
    - id: tail_fan_display
      region: caudal
      driver: pose
      range: [0, 1]
    - id: plumage_ruffle
      region: dorsal
      driver: pose
      range: [0, 1]
    - id: juvenile_down
      region: body
      driver: life_stage
      range: [0, 1]

animation_contacts:
  - id: walk_cycle
    kind: gait
    targets:
      - selector: "bone:pes_toe_l"
        tolerance_m: 0.01
        surface: ground
      - selector: "bone:pes_toe_r"
        tolerance_m: 0.01
        surface: ground
  - id: snap_forage
    kind: browse
    targets:
      - selector: "bone:beak_tip"
        tolerance_m: 0.03
        surface: ground
  - id: display
    kind: alert
    targets:
      - selector: "bone:tail_tip"
        tolerance_m: 0.0
        surface: none
  - id: dust_bathe
    kind: rest
    targets:
      - selector: "bone:pelvis"
        tolerance_m: 0.05
        surface: ground

