      region: dorsal
      pattern: mottled_banded
      size_mm: [12, 34]
      density_per_m2: 6000
      roughness: [0.45, 0.75]
      age_dependence: grows_with_age
    - id: belly_down
      region: ventral
      pattern: smooth
      size_mm: [6, 16]
      density_per_m2: 9000
      roughness: [0.4, 0.7]
    - id: bare_leg_skin
      region: limb
      pattern: granular
      size_mm: [2, 5]
      density_per_m2: 2500
      roughness: [0.6, 0.85]
    - id: crest_tract
      region: head
      pattern: shaggy
      size_mm: [20, 55]
      density_per_m2: 3000
      roughness: [0.4, 0.65]
      age_dependence: grows_with_age
  bristle_zones:
    - id: flank_feather_tips
      region: flank
      length_mm: [12, 30]
      density_per_m2: 3000
      stiffness: 0.25
      asymmetry: 0.2
      wind_response: whip
      age_dependence: grows_with_age
      uncertainty: speculative
      hypothesized_function: ornament
    - id: crest_plumes
      region: cheek
      length_mm: [18, 40]
      density_per_m2: 800
      stiffness: 0.35
      asymmetry: 0.3
      wind_response: flexible
      age_dependence: grows_with_age
      uncertainty: speculative
      hypothesized_function: communication
  fold_zones:
