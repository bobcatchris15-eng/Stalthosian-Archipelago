      region: ankle
      depth_mm: 3
      pose_driven: true
  pigmentation:
    pattern: mottled
    age_change: down pattern breaks into adult streaking
    wear: light

material_masks:
  - id: plumage_body
    applies_to: body
    surface_type: hide
    vertex_group: body_plumage
    base_color: "#6b5334"
    color_range: ["#4e3c26", "#6b5334", "#87693f", "#2f261a"]
    roughness: [0.4, 0.7]
    sss: 0.35
    mask_uv: mask_plumage
  - id: bare_skin
    applies_to: foot_pad
    surface_type: foot_pad
    roughness: [0.6, 0.9]
    normal_strength: 1.4
  - id: beak_horn
    applies_to: beak
    surface_type: beak
