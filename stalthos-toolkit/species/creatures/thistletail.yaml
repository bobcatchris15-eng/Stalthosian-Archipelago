# Thistletail -- small flightless feathered omnivore (lineage stub).
#
# Source of record: Rauken-Archipelago/docs/creatures.md, "Thistletail" section.
# Purpose: prove the creature contract generalizes beyond a quadruped hero -- a
# small biped with plumage instead of scales, no armour, and a different rig.
# All numbers are invented working values for a fictional taxon; no citation is
# asserted.
schema: creature-definition
kind: creature
id: creature.thistletail.tt1
version: 1

common_names:
  primary: Thistletail
  working: true
  aka: [thistle tail, taily]

uncertainty: speculative
morphology_family: birdlike paravian-inspired animal (inspiration, not settled ancestry)
generator: biped_paravian

evidence:
  - feature: feathered covering with region-specific tracts
    tier: comparative_inference
  - feature: bipedal digitigrade stance with reduced forelimbs
    tier: documented
  - feature: quick-start/stop locomotion and display postures
    tier: biomechanical_plausibility
  - feature: plumage display shape and density change with age
    tier: speculative
    note: Invented display design; not a claim about any fossil bird.
  - feature: parental nesting behaviour
    tier: speculative
    note: Broad ground-fowl analogy only; no fossil behaviour is asserted.

