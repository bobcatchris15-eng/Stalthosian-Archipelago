schema: species-definition
kind: plant
id: plant.splitcrown.ar1
version: 1

common_names:
  primary: Splitcrown
  working: true
  aka: [splitcrown conifer, crown-splitter araucarian]

uncertainty: biomechanical_plausibility
morphology_family: Araucaria-like conifer (silhouette analogy only)
generator: branching_tree

anatomy:
  branching_pattern:
    architecture: irregular_tiered
    order_max: 4
    branch_angle_deg: [55, 78]
    branch_length_ratio: 0.62
    taper: 0.55
    root_flare: 0.85
    notes: >-
      One dominant leader that forks late (the "split"), irregular horizontal
      whorl tiers, dead lower branch stubs retained for silhouette honesty.
  phyllotaxy:
    pattern: spiral
    divergence_deg: 137.5
    phyllotaxis_fraction: 0.382
  foliage:
    organ: scale_spray
    overall_shape: needled
    margin: entire
    apex: acute
    length: { value: 3.5, unit: cm }
    width: { value: 0.9, unit: cm }
    aspect_ratio: 3.9
    venation:
      pattern: parallel
      relief: raised
    surface:
      waxy_cuticle: 0.6
      hairs: none
      underside: pale
      translucency: 0.1
      flexibility_deg: 25
  stem:
    type: woody
    diameter_at_base: { value: 2.4, unit: m }
    growth_direction: erect
    segmented: false
    bark:
      pattern: fissured
      plate_scale_m: 0.45
  root:
    system: buttress
    depth: { value: 2.5, unit: m }
    spread: { value: 6.0, unit: m }
    exposed: false
  reproductive:
    structure: cone
    placement: terminal
    size: { value: 0.22, unit: m }
    seasonal: false

