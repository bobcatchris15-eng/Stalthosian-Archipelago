    wind_stiffness: 0.6
  - id: mature
    age_label: mature woodland tree
    age_years: [60, 400]
    height: { value: 26.0, unit: m }
    crown_spread: { value: 12.0, unit: m }
    proportions: { leader_share: 0.86, foliage_share: 0.38, root_flare_share: 0.3 }
    foliage_density: 0.55
    wind_stiffness: 0.85
    visible_traits: [leader_fork, retained_dead_branch_stubs, heavy_root_flare]

materials:
  - id: bark_rough
    applies_to: bark
    surface_type: bark
    base_color: "#5b4a3c"
    color_range: ["#4a3b30", "#5b4a3c", "#6b5a49", "#3f332a"]
