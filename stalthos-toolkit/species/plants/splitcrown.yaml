# Splitcrown -- flagship large conifer reference asset (pipeline verification).
#
# Source of record: Rauken-Archipelago/docs/flora.md, "Plant community" table row
# "Araucarian-like large conifer | Splitcrown". Everything below is a visual/
# structural design statement for a fictional taxon; nothing here is a taxonomic
