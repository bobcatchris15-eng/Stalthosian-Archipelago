      min_m: 0.3
      max_m: 2.5
      selector: "branch:order<=2"
      forage: available
    - id: sapling_tips
      min_m: 0.3
      max_m: 1.6
      selector: "growth_stage:sapling|tip"
      forage: preferred
      season: tender_growth
    - id: canopy_foliage
      min_m: 8.0
      max_m: 26.0
      selector: "whorl:all"
      forage: structural

habitat_tags: [main_island_woodland, rocky_upland, ravine, clearing_edge]

