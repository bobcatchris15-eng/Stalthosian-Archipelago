    branch_angle: [50, 82]
    whorl_spacing: [0.55, 0.95]
    tier_sag: [0.0, 0.25]
    foliage_density: [0.45, 0.7]
    leader_fork_height: [0.55, 0.85]
    bark_plate_scale: [0.3, 0.6]
  variants:
    - id: old_woodland
      label: old woodland giant with root flare and dead stubs
      weight: 0.35
      habitat_tags: [main_island_woodland, ravine]
      overrides: { root_flare: 0.95, tier_sag: 0.1, dead_branch_share: 0.18 }
    - id: upland_ridge
      label: wind-pressed upland form
      weight: 0.25
      habitat_tags: [rocky_upland, butte_crown]
      overrides: { wind_stiffness: 0.95, tier_sag: 0.22, foliage_density: 0.45 }
