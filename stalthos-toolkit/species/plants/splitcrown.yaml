    normal_strength: 1.2
    bump_scale_m: 0.12
  - id: foliage_spray
    applies_to: leaf
    surface_type: cuticle
    base_color: "#2f4a2c"
    color_range: ["#24391f", "#2f4a2c", "#3b5c34", "#4d6b38"]
    roughness: [0.45, 0.68]
    sss: 0.15
    wind_response: stiff

variation:
