    frond_length: [0.7, 1.35]
    frond_arch: [0.3, 0.95]
    pinna_size: [0.6, 1.4]
    crozier_share: [0.0, 0.3]
  variants:
    - id: wet_hollow
      label: tall wet-hollow form
      weight: 0.4
      habitat_tags: [wet_hollow, humid_woodland]
      overrides: { frond_length: 1.3, frond_count: 14 }
    - id: wall_drooper
      label: wall/crevice drooping form
      weight: 0.25
      habitat_tags: [rainridge_rockface, rock_face]
      overrides: { frond_arch: 0.95, frond_count: 9 }
    - id: grazed_clump
