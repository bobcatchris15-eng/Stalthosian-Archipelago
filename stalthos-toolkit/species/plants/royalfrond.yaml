# Royal frond -- fine-leaved fern asset (pipeline verification).
# Source of record: Rauken-Archipelago/docs/flora.md, "Royal-fern analogue |
# Royal frond": moist woodlands, large fronds; young fronds variably palatable.
schema: species-definition
kind: plant
id: plant.royalfrond.fn1
version: 1

common_names:
  primary: Royal frond
  working: true
  aka: [royal fern, crown frond]

uncertainty: biomechanical_plausibility
morphology_family: Osmunda-like royal fern (frond architecture analogy only)
generator: compound_frond

anatomy:
  branching_pattern:
    architecture: rosette_crown
    order_max: 2
    branch_angle_deg: [55, 80]
    branch_length_ratio: 0.5
    taper: 0.45
    root_flare: 0.2
    notes: >-
      Clump-forming crown of bipinnate fronds on short fibrous petioles; fiddlehead
      (crozier) stage is a separate juvenile silhouette, not a recolour.
  phyllotaxy:
    pattern: basal_sheathing
    divergence_deg: 360
  foliage:
    organ: frond
    overall_shape: bipinnate
    margin: pinnatifid
    apex: acuminate
    length: { value: 1.6, unit: m }
    width: { value: 0.55, unit: m }
    aspect_ratio: 2.9
    pinnation:
      pinnae_per_side: 22
      pinnae_series: 2
      pinna_length_ratio: 0.28
      petiole_ratio: 0.35
      rachis_arc_deg: -18
    venation:
      pattern: dichotomous
      relief: flat
    surface:
      waxy_cuticle: 0.15
      hairs: sparse
      underside: pale
      translucency: 0.65
      flexibility_deg: 85
  stem:
    type: herbaceous
    diameter_at_base: { value: 0.045, unit: m }
    growth_direction: arching
    segmented: false
  root:
    system: fibrous
    depth: { value: 0.35, unit: m }
    spread: { value: 0.9, unit: m }
    exposed: false
  reproductive:
    structure: sorophore
    placement: underside
    size: { value: 0.08, unit: m }
    seasonal: true

growth_stages:
  - id: crozier
    age_label: crozier (fiddlehead)
    age_years: [0, 0.2]
    height: { value: 0.18, unit: m }
    crown_spread: { value: 0.25, unit: m }
    proportions: { frond_share: 1.0, pinna_share: 0.0, rachis_share: 1.0 }
    foliage_density: 0.2
    wind_stiffness: 0.0
    visible_traits: [coiled_tip, tomentose_scale]
  - id: juvenile
    age_label: juvenile frond
    age_years: [0.2, 1]
    height: { value: 0.55, unit: m }
    crown_spread: { value: 0.6, unit: m }
    proportions: { frond_share: 1.0, pinna_share: 0.55, rachis_share: 1.0 }
    foliage_density: 0.7
    wind_stiffness: 0.15
  - id: mature
    age_label: mature frond clump
    age_years: [1, 12]
    height: { value: 1.7, unit: m }
    crown_spread: { value: 1.6, unit: m }
    proportions: { frond_share: 1.0, pinna_share: 1.0, rachis_share: 1.0 }
    foliage_density: 1.0
    wind_stiffness: 0.3
    visible_traits: [bipinnate_silhouette, sori_band_on_underside, arching_fronds]

materials:
  - id: rachis_fibrous
    applies_to: stem
    surface_type: herbaceous
    base_color: "#9c8b4a"
    color_range: ["#7d6c37", "#9c8b4a", "#b6a45e"]
    roughness: [0.5, 0.8]
    sss: 0.2
    wind_response: flexible
  - id: pinna_green
    applies_to: pinna
    surface_type: herbaceous_translucent
    base_color: "#4f7a3c"
    color_range: ["#3d6630", "#4f7a3c", "#63934a", "#7ba45a"]
    roughness: [0.35, 0.6]
    sss: 0.6
    wind_response: flexible
  - id: sori_band
    applies_to: sorus
    surface_type: herbaceous
    base_color: "#6b4a22"
    roughness: [0.7, 0.9]
    wind_response: flexible

variation:
