  - id: definition-cc0
    applies_to: definition
    license: CC0-1.0
    holder: The Stalthosian Archipelago project
  - id: geometry-cc0
    applies_to: generated_geometry
    license: CC0-1.0
    holder: The Stalthosian Archipelago project
  - id: textures-cc0
    applies_to: textures
    license: CC0-1.0
    holder: The Stalthosian Archipelago project

notes: >-
  Exercises the jointed_rush generator: segmentation, sheath rings, whorled
  branchlets and a silica/tag-gated forage profile that is deliberately worse
  food than Softbough.